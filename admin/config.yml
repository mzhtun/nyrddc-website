backend:
  name: git-gateway
  branch: main

# GitHub တိုက်ရိုက် သုံးလိုပါက အထက်အစား:
# backend:
#   name: github
#   repo: mzhtun/nyrddc-website
#   branch: main

publish_mode: editorial_workflow
media_folder: "assets/uploads"
public_folder: "/assets/uploads"
# Netlify deploy ပြီးမှ ရလာသော URL ဖြင့် အစားထိုးပါ (ဥပမာ https://nyrddc-website.netlify.app)
site_url: https://nyrddc-website.netlify.app
display_url: https://nyrddc-website.netlify.app
logo_url: /assets/logo.png

collections:
  - name: "news"
    label: "သတင်းများ"
    label_singular: "သတင်း"
    folder: "content/news"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    editor: { preview: true }
    fields:
      - { label: "ခေါင်းစဉ်", name: "title", widget: "string" }
      - { label: "ရက်စွဲ", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "အကျဉ်းချုပ်", name: "excerpt", widget: "text", required: false }
      - { label: "ပုံ", name: "image", widget: "image", required: false }
      - { label: "Facebook Link", name: "link", widget: "string", required: false, default: "https://www.facebook.com/NYRDDCYGN" }
      - { label: "အကြောင်းအရာ", name: "body", widget: "markdown" }

  - name: "pages"
    label: "စာမျက်နှာ ဆက်တင်များ"
    files:
      - label: "ပင်မ စာမျက်နှာ"
        name: "home"
        file: "content/home.json"
        fields:
          - { label: "Hero ခေါင်းစဉ်", name: "hero_title", widget: "string" }
          - { label: "Hero အကျဉ်း", name: "hero_tag", widget: "text" }
          - { label: "ဘွဲ့ရရှိသူ အရေအတွက်", name: "graduates", widget: "string", default: "၄,၀၀၇+" }

  - name: "programs"
    label: "သင်တန်းများ၏ ဘာသာရပ်များ"
    files:
      - label: "ဘာသာရပ်များ"
        name: "subjects"
        file: "content/programs.json"
        fields:
          - { label: "ဝိဇ္ဇာ (B.A.) ဘာသာရပ်များ", name: "ba_subjects", widget: "list", field: { label: "ဘာသာရပ်", name: "subject", widget: "string" } }
          - { label: "သိပ္ပံ (B.Sc.) ဘာသာရပ်များ", name: "bsc_subjects", widget: "list", field: { label: "ဘာသာရပ်", name: "subject", widget: "string" } }
          - { label: "A.G.T.I. ဘာသာရပ်များ", name: "agti_subjects", widget: "list", field: { label: "ဘာသာရပ်", name: "subject", widget: "string" } }

  - name: "departments"
    label: "ဌာနများ"
    files:
      - label: "ဌာနစာရင်း"
        name: "list"
        file: "content/departments.json"
        fields:
          - label: "ဌာနများ"
            name: "departments"
            widget: "list"
            fields:
              - { label: "ဌာနအမည်", name: "name", widget: "string" }
              - { label: "ဌာနမှူး အမည်", name: "head_name", widget: "string" }
              - { label: "ဌာနမှူး ရာထူး", name: "head_title", widget: "string", required: false }
              - { label: "ဌာနမှူး ဓာတ်ပုံ", name: "photo", widget: "image", required: false }

  - name: "principal"
    label: "ကျောင်းအုပ်စကား"
    files:
      - label: "ကျောင်းအုပ်စကား"
        name: "message"
        file: "content/principal.json"
        fields:
          - { label: "ကျောင်းအုပ်စကား", name: "message", widget: "text" }
          - { label: "ကျောင်းအုပ်ကြီး အမည်", name: "principal_name", widget: "string" }
          - { label: "ရာထူး", name: "principal_title", widget: "string" }
          - { label: "ဓာတ်ပုံ", name: "principal_photo", widget: "image", required: false }
  - name: "staff"
    label: "ဝန်ထမ်းစာရင်း"
    files:
      - label: "ဝန်ထမ်းစာရင်း"
        name: "list"
        file: "content/staff.json"
        fields:
          - label: "ဝန်ထမ်းများ"
            name: "staff"
            widget: "list"
            fields:
              - { label: "အမည်", name: "name", widget: "string" }
              - { label: "ရာထူး", name: "role", widget: "string" }
              - { label: "ဌာန", name: "department", widget: "string", required: false }
              - { label: "ဓာတ်ပုံ", name: "photo", widget: "image", required: false }
              - label: "အဖွဲ့"
                name: "group"
                widget: "select"
                options:
                  - { label: "ကောလိပ် ဦးဆောင်မှု", value: "leadership" }
                  - { label: "ဌာနမှူးများ", value: "heads" }
                default: "leadership"
              - { label: "အစဉ်", name: "order", widget: "number", required: false }
              - { label: "နမူနာ", name: "is_sample", widget: "boolean", required: false }
  - name: "eligibility"
    label: "ဝင်ခွင့် အရည်အချင်း သတ်မှတ်ချက်များ"
    files:
      - label: "အရည်အချင်း သတ်မှတ်ချက်များ"
        name: "criteria"
        file: "content/eligibility.json"
        fields:
          - { label: "နိဒါန်း", name: "intro", widget: "text" }
          - label: "အရည်အချင်း သတ်မှတ်ချက်များ"
            name: "requirements"
            widget: "list"
            fields:
              - { label: "အချက်", name: "text", widget: "string" }
              - { label: "နမူနာ", name: "is_sample", widget: "boolean", required: false }
          - label: "ရွေးချယ်ပုံ အဆင့်ဆင့်"
            name: "steps"
            widget: "list"
            fields:
              - { label: "အဆင့် ခေါင်းစဉ်", name: "title", widget: "string" }
              - { label: "အသေးစိတ်", name: "text", widget: "text" }
          - { label: "မှတ်ချက်", name: "note", widget: "text" }
